[workspace]
resolver = "2"
members = ["crates/lwo-core"]
# Rendering spikes live in their own workspace so their heavy dependencies
# never affect the product build. They are deleted after the Milestone 0 decision.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
